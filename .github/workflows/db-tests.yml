# ============================================================
# db-tests — terapkan semua migrasi lalu uji antrean render Postgres
# (supabase/migrations/032_render_queue.sql).
#
# Kenapa memakai image supabase/postgres: migrasi repo ini bergantung pada
# FK ke `auth.users` (007, 008, 011, 015) dan pada `storage.buckets`
# (013, 017), jadi image Supabase dipakai agar schema auth/storage + role
# bawaan tersedia. Bila ada objek yang belum ada, supabase/tests/ci_bootstrap.sql
# menirunya secara idempoten (role anon/authenticated/service_role,
# auth.uid(), publication supabase_realtime, tabel minimal auth.users /
# storage.buckets).
#
# CATATAN migrasi lama: sebagian migrasi menyertakan query VERIFIKASI manual
# ber-placeholder (mis. 028 "... where user_id = '<USER_UUID>'") yang tidak
# bisa dieksekusi psql. Karena itu tiap file diterapkan: ketat dulu
# (ON_ERROR_STOP=1); bila gagal, diulang tanpa ON_ERROR_STOP dan dicatat
# sebagai ::warning — error tetap tampil di log, hanya tidak menggagalkan job.
# Migrasi 032 sendiri tidak boleh gagal: kegagalannya akan terlihat pada
# langkah "Verifikasi objek 032" (PASS/FAIL) dan pada uji T1-T9.
# ============================================================
name: db-tests

on:
  push:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/verify_staging.sql"
      - ".github/workflows/db-tests.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/verify_staging.sql"
      - ".github/workflows/db-tests.yml"
  workflow_dispatch: {}

concurrency:
  group: db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-queue:
    name: render queue (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        # Postgres 17 + schema/role bawaan Supabase (kecuali role anon/
        # authenticated/service_role yang dibuat oleh ci_bootstrap.sql bila
        # belum ada). Versi mengikuti image yang dipakai `supabase start` lokal.
        image: supabase/postgres:17.11.0.002
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PGCLIENTENCODING: UTF8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pastikan klien psql tersedia
        run: |
          psql --version || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
            psql --version
          }

      - name: Tunggu Postgres siap
        run: |
          for i in $(seq 1 60); do
            if pg_isready -h "$PGHOST" -p "$PGPORT" >/dev/null 2>&1; then
              echo "Postgres siap (percobaan $i)"; exit 0
            fi
            sleep 2
          done
          echo "Postgres tidak siap setelah 120 dtk"; exit 1

      - name: Tentukan kredensial superuser
        run: |
          for u in supabase_admin postgres; do
            if psql -U "$u" -tAc "select current_user" >/dev/null 2>&1; then
              echo "PGUSER=$u" >> "$GITHUB_ENV"
              echo "superuser DB: $u"
              psql -U "$u" -tAc "select version()"
              exit 0
            fi
          done
          echo "Tidak ada kredensial psql yang berhasil (supabase_admin/postgres)"; exit 1

      - name: Bootstrap role & schema Supabase (idempoten)
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/ci_bootstrap.sql

      - name: Terapkan semua migrasi (001 -> 032)
        run: |
          set -uo pipefail
          rc=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "::group::migrasi $f"
            if psql -v ON_ERROR_STOP=1 -q -f "$f" > /tmp/mig.log 2>&1; then
              echo "OK(strict) $f"
            else
              echo "::warning file=$f::gagal dengan ON_ERROR_STOP=1 (biasanya query verifikasi manual ber-placeholder) — file diulang tanpa ON_ERROR_STOP"
              tail -n 20 /tmp/mig.log
              psql -v ON_ERROR_STOP=0 -q -f "$f" 2>&1 | tail -n 20 || true
            fi
            echo "::endgroup::"
          done
          echo "migrasi selesai"
          exit $rc

      - name: Verifikasi objek 032 (PASS/FAIL)
        run: |
          psql -v ON_ERROR_STOP=1 -q -At -F '|' -f supabase/verify_staging.sql | tee /tmp/verify.log
          if grep -q '|FAIL' /tmp/verify.log; then
            echo "::error::ada pemeriksaan verify_staging.sql yang FAIL"
            exit 1
          fi
          echo "semua pemeriksaan verify_staging.sql PASS"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tes SQL + konkurensi (T1-T9)
        run: |
          set +e
          node supabase/tests/render_queue.test.mjs 2>&1 | tee /tmp/tes.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # Detail dipancarkan sebagai ANNOTATION (bisa dibaca tanpa hak
            # admin repo) supaya penyebab gagal terlihat tanpa log mentah.
            echo "::error::tes T1-T9 gagal (exit $rc); log $(wc -l < /tmp/tes.log) baris, notice OK=$(grep -c 'OK T' /tmp/tes.log)"
            grep -nE 'FAIL|GAGAL|ERROR:|FATAL|DETAIL:|HINT:|CONTEXT:' /tmp/tes.log \
              | tail -n 25 | while IFS= read -r l; do echo "::error::$l"; done
            echo "::error::5 baris terakhir:"
            tail -n 5 /tmp/tes.log | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit "$rc"
